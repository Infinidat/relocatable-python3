[buildout]
extends = buildout-build.cfg

parts = runtime libtool libiconv zlib bzip2 lz4 xz zstd libmd libbsd pcre2 ncurses expat readline cppunit openssl libev libxml2 libunistring libtasn1 gettext openssh gmp libgpg-error libgcrypt nettle libxslt libevent libuv libsodium libidn2 tcl expect dejagnu libffi sqlite cyrus-sasl openldap gdbm c-ares libgnugetopt gnutls libuuid zeromq mpdecimal graphviz-bootstrap graphviz libb2 softhsm2 python dist

[options]
cflags = -pipe -O2 -fPIC -maix64
ldflags = -L${:prefix}/lib -Wl,-blibpath:/usr/lib -Wl,-b64 -Wl,-brtl -Wl,-bmaxdata:0x80000000

[environment]
PATH = ${options:prefix}/bin:${options:toolkit}/bin:/bin:/usr/bin:/sbin:/usr/sbin
LIBPATH = ${options:prefix}/lib
LDFLAGS = ${options:ldflags}
OBJECT_MODE = 64
AR = ar -X64
NM = nm -B -X64

[openssl]
openssldir = /var/ssl
target = aix64-gcc

[lz4]
make-options += SONAME_FLAGS=

[nettle]
configure-options += --disable-fat

[gnutls]
environment-section = gnutls-environment
configure-options += LIBS=-lgnugetopt

[gnutls-environment]
<= environment
CFLAGS = ${environment:CFLAGS} -I${options:prefix}/include/getopt

[libuuid]
make-targets = install

[graphviz-environment]
CFLAGS = ${environment:CFLAGS} -pthread -I${options:prefix}/include/getopt
CXXFLAGS = ${environment:CFLAGS} -pthread -I${options:prefix}/include/getopt
LDFLAGS = ${environment:LDFLAGS} -Wl,-bbigtoc -lgnugetopt

[zeromq]
configure-options += --with-cv-impl=pthread

[python]
patches += ${:patches-dir}/${:name}-${:version}-aix.patch
           ${:patches-dir}/${:name}-${:version}-aix-shared.patch

[python-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,-bbigtoc

[dist]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}/tests
configure-command = ${options:prefix}/bin/python
configure-options = ${buildout:directory}/tests/test_dist.py
                    --dist ${options:prefix}
                    --python-version ${python:version}
                    --openssl-version ${openssl:version}
                    --zlib-version ${zlib:version}
                    --sqlite-version ${sqlite:runtime}
                    --libffi-version ${libffi:version}
                    --bzip2-version ${bzip2:version}
                    --liblzma-version ${xz:version}
                    --tcl-version ${tcl:version}
                    --expat-version ${expat:version}
                    --openssl-crypto-library libcrypto.so
                    --openssl-ssl-library libssl.so
                    --zlib-library libz.so
                    --sqlite-library libsqlite3.so
                    --libffi-library libffi.so
                    --bzip2-library libbz2.so
                    --liblzma-library liblzma.so
                    --tcl-library libtcl8.6.so
                    --expat-library libexpat.so
