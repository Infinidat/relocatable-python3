[buildout]
extends = buildout-build-solaris.cfg

[environment]
PATH = ${options:prefix}/bin:${options:toolkit}/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/ccs/sparcv9/bin:/usr/ccs/bin:/opt/csw/bin:/opt/csw/gnu
LD = /usr/ccs/bin/sparcv9/ld

[openssl]
target = solaris64-sparcv9-gcc

[pcre2]
configure-options += --disable-jit

[python-environment]
CPPFLAGS = ${environment:CPPFLAGS} -Dsparc
