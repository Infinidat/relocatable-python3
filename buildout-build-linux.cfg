[buildout]
extends = buildout-build.cfg

[options]
cflags = -pipe -O2 -fPIC
ldflags = -Wl,--library-path=${:prefix}/lib -Wl,--rpath-link=${:prefix}/lib

[environment]
PATH = ${options:prefix}/bin:${options:toolkit}/bin:/bin:/usr/bin:/sbin:/usr/sbin
LDFLAGS = ${options:ldflags} -Wl,--rpath=\$$ORIGIN -Wl,--rpath=\$$ORIGIN/.. -Wl,--rpath=\$$ORIGIN/../lib
LD_LIBRARY_PATH = ${options:prefix}/lib

[openssl]
openssldir = /etc/ssl

[zstd-environment]
LDFLAGS = ${options:ldflags} -Wl,--rpath='\$$\$$ORIGIN' -Wl,--rpath='\$$\$$ORIGIN/..' -Wl,--rpath='\$$\$$ORIGIN/../lib'

[gnutls]
configure-options += LIBS=-ldl

[graphviz-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,--rpath=\$$ORIGIN/graphviz -Wl,--rpath=\$$ORIGIN/../lib/graphviz

[python]
configure-options += --enable-optimizations --with-lto=full

[python-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,-rpath,\$$ORIGIN/../..  -Wl,-rpath,\$$ORIGIN/../../..  -Wl,-rpath,\$$ORIGIN/../../../..  -Wl,-rpath,\$$ORIGIN/../../../../..  -Wl,-rpath,\$$ORIGIN/../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../../../parts/python/lib
