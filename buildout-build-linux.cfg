[buildout]
extends = buildout-build.cfg

[options]
host = x86_64-linux-gnu
cflags = -pipe -O2 -fPIC
ldflags = -Wl,--library-path=${:prefix}/lib -Wl,--rpath-link=${:prefix}/lib

[environment]
PATH = ${options:prefix}/bin:/opt/infinidat/toolkit/bin:/home/ubuntu/python/bin:/bin:/usr/bin:/sbin:/usr/sbin
LDFLAGS = ${options:ldflags} -Wl,--rpath=\$$ORIGIN -Wl,--rpath=\$$ORIGIN/.. -Wl,--rpath=\$$ORIGIN/../lib
LD_LIBRARY_PATH = ${options:prefix}/lib

[openssl]
ssldir = /etc/ssl
target = linux-x86_64

[zstd-environment]
LDFLAGS = ${options:ldflags} -Wl,--rpath='\$$\$$ORIGIN' -Wl,--rpath='\$$\$$ORIGIN/..' -Wl,--rpath='\$$\$$ORIGIN/../lib'

[gnutls]
configure-options += LIBS=-ldl

[graphviz-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,--rpath=\$$ORIGIN/graphviz -Wl,--rpath=\$$ORIGIN/../lib/graphviz

[python]
configure-options += --with-lto=full

[python-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,--rpath=\$$ORIGIN/../.. -Wl,--rpath=\$$ORIGIN/../../.. -Wl,--rpath=\$$ORIGIN/../../../..
