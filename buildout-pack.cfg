[buildout]
develop = .

installed = .installed-pack.cfg

parts = pack

# location of the download cache is specified by the download-cache option
download-cache = .cache

log-level = DEBUG

executable = dist/bin/python

[pack]
recipe = infi.recipe.python:pack

include_list =
    dist/bin/python
    dist/bin/python3
    dist/bin/python3.11
    dist/bin/python3-config
    dist/bin/python3.11-config
    dist/include
    dist/lib

exclude_list =
    dist/lib/engines
    dist/lib/python3.11/test
    dist/lib/python3.11/ctypes/test
    dist/lib/python3.11/distutils/tests
    dist/lib/python3.11/idlelib/idle_test
    dist/lib/python3.11/lib2to3/tests
    dist/lib/python3.11/tkinter/test
    dist/lib/python3.11/unittest/test
