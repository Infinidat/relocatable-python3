[buildout]
extends = buildout-build-solaris-x64.cfg
parts = runtime libtool libiconv zlib bzip2 lz4 xz zstd libmd pcre2 ncurses expat readline openssl libev
    libxml2 libunistring libtasn1 gettext openssh gmp libgpg-error libgcrypt nettle libxslt libevent
    libuv libsodium libidn2 libffi sqlite cyrus-sasl openldap gdbm c-ares gnutls zeromq mpdecimal
    graphviz-bootstrap graphviz libb2 python setuptools yarl cython greenlet gevent sherlock-client

[options]
host = x86_64-pc-solaris2.11
CFLAGS="-fpermissive -std=c++11"
SODIUM_INSTALL=system

[base-part]
recipe = hexagonit.recipe.cmmi
<= options

[setuptools]
recipe = zc.recipe.egg
eggs = setuptools==65.5.0
index = https://pypi.org/simple


[sherlock-client]
recipe = zc.recipe.egg
eggs = sherlock-client==256.0.0



[libsodium]
<= base-part
name = libsodium
version = 1.0.20
url = https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
patches=

[cython]
recipe = zc.recipe.egg
eggs = cython==3.0.7
index = https://pypi.org/simple

[yarl]
recipe = zc.recipe.egg
eggs =
    yarl==1.9.4
    multidict>=6.0
    typing-extensions>=4.0
    idna>=2.0
index = https://pypi.org/simple

[greenlet]
recipe = zc.recipe.egg
eggs = greenlet==3.0.3
index = https://pypi.org/simple
environment = greenlet-env

[greenlet-env]
CFLAGS = -fpermissive -std=c++11
CXXFLAGS = -fpermissive -std=c++11

[gevent]
recipe = zc.recipe.egg
eggs = gevent==22.10.2
index = https://pypi.org/simple
