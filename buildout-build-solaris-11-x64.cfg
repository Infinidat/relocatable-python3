[buildout]
extends = buildout-build-solaris-x64.cfg
parts = runtime libtool libiconv zlib bzip2 lz4 xz zstd libmd pcre2 ncurses expat readline openssl libev
    libxml2 libunistring libtasn1 gettext openssh gmp libgpg-error libgcrypt nettle libxslt libevent
    libuv libsodium libidn2 libffi sqlite cyrus-sasl openldap gdbm c-ares gnutls zeromq mpdecimal
    graphviz-bootstrap graphviz libb2 python setuptools yarl cython greenlet gevent sherlock-client

[options]
host = x86_64-pc-solaris2.11
CFLAGS="-fpermissive -std=c++11"
SODIUM_INSTALL=system
ignore-existing = true
keep-compile-dir = true
environment-section = environment
toolkit = /opt/infinidat/toolkit
prefix = ${buildout:directory}/dist
configure-command = ${environment:CONFIG_SHELL} configure
configure-options = --host=${:host}
                    --build=${:host}
                    --target=${:host}
                    --prefix=${:prefix}
                    --libdir=${:prefix}/lib
patches-dir = ${buildout:directory}/src/patches
patch-options = -p1
hooks-dir = ${buildout:directory}/src/hooks
pre-make-hook = ${options:hooks-dir}/posix.py:pre_make_hook
make-options = SHELL=${environment:SHELL}
make-targets = install check


[environment]
LANG = C
LC_ALL = C
LANGUAGE = C
INPUTRC =
TERM = xterm
SHELL = ${options:toolkit}/bin/bash
CONFIG_SHELL = ${:SHELL}
CC = gcc ${options:cflags}
CXX = g++ ${options:cflags}
CFLAGS = ${options:cflags} -I${options:prefix}/include
CPPFLAGS = ${:CFLAGS}
CXXFLAGS = ${:CFLAGS}
LDXXFLAGS = ${:LDFLAGS}
SHARED_LDFLAGS = ${:LDFLAGS}
PKG_CONFIG_PATH = ${options:prefix}/lib/pkgconfig
PKG_CONFIG = ${options:toolkit}/bin/pkg-config
SSL_CERT_FILE = ${options:toolkit}/etc/ssl/certs/ca-bundle.crt








[base-part]
recipe = hexagonit.recipe.cmmi
<= options

[setuptools]
<= base-part
eggs = setuptools==72.2.0
url = https://files.pythonhosted.org/packages/ce/ef/013ded5b0d259f3fa636bf35de186f0061c09fbe124020ce6b8db68c83af/setuptools-72.2.0.tar.gz
index = https://pypi.org/simple


[sherlock-client]
recipe = zc.recipe.egg
url = https://pypi.infinidat.com/pypi/sherlock-client/256.0.0/
eggs = sherlock-client==256.0.0



[libsodium]
<= base-part
name = libsodium
version = 1.0.20
url = https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable.tar.gz
patches=

