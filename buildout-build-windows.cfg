[buildout]
extends = buildout-build.cfg
extensions = buildout.environ
parts = mkdir zlib xz libiconv bzip2 openssl tcl tk sqlite libxml2 libxslt libevent libffi python python-win python-test

[environment-windows]
LANG = C
LC_ALL = C
LANGUAGE = C
INPUTRC =
XSystemDrive = C:
XWinDir = ${:XSystemDrive}\WINDOWS
XProgramFiles = ${:XSystemDrive}\Program Files (x86)
FrameworkDir = ${:XWinDir}\Microsoft.NET\Framework64
FrameworkVersion = v4.0.30319
WindowsSdkDir = ${:XProgramFiles}\Windows Kits\10
VSINSTALLDIR = ${:XProgramFiles}\Microsoft Visual Studio\2017\Enterprise
VCRoot = ${:VSINSTALLDIR}\VC
VCINSTALLDIR = ${:VCRoot}
NODEBUG = 1
DevEnvDir = ${:VSINSTALLDIR}\Common7\IDE
Msvc = ${:VCRoot}\Tools\MSVC\14.16.27023
XSDKVer = 10.0.17763.0
WindowsSdkInclude = ${:WindowsSdkDir}\Include\${:XSDKVer}
WindowsSdkLib = ${:WindowsSdkDir}\Lib\${:XSDKVer}
VSLIB = ${:Msvc}\lib\x64
VSBIN = ${:Msvc}\bin\Hostx64\x64
SDKBIN = ${:WindowsSdkDir}\bin\${:XSDKVer}\x64
LIB = ${:VSLIB};${:WindowsSdkLib}\um\x64;${:WindowsSdkLib}\ucrt\x64;${:PREFIX}\lib
LIBPATH = ${:FrameworkDir};${:FrameworkDir}\${:FrameworkVersion};${:VSLIB}
INCLUDE = ${:WindowsSdkInclude}\shared;${:WindowsSdkInclude}\um;${:WindowsSdkInclude}\ucrt;${:Msvc}\include;${:PREFIX}\include
CygwinBinDir = ${:XSystemDrive}\Cygwin\bin
PATH = ${:VSINSTALLDIR}\MSBuild\15.0\Bin;${:DevEnvDir};${:VSBIN};${:VSINSTALLDIR}\Common7\Tools;${:VSINSTALLDIR}\Common7\Tools\bin;${:FrameworkDir};${:FrameworkDir}\Microsoft .NET Framework 3.5 (Pre-Release Version);${:FrameworkDir}\${:FrameworkVersion};${:VCRoot}\VCPackages;${:SDKBIN};${buildout:directory}\tools\python\bin;${buildout:directory}\tools\python\Scripts;${buildout:directory}\tools\cmake\bin;${buildout:directory}\tools\perl\bin;${buildout:directory}\tools\nasm;${:CygwinBinDir};${:XWinDir}\system32;${:XWinDir};${:XWinDir}\System32\Wbem
PREFIX = ${options:prefix}
IIPREFIX = ${options:prefix}
MSVCDIR = ${:VSINSTALLDIR}
VCTargetsPath = ${:VSINSTALLDIR}\Common7\IDE\VC\VCTargets

[options]
configure-command = true
configure-options =
make-binary = true
make-options =
make-targets =
environment-section = environment-windows
prefix = ${buildout:directory}\dist
hooks-dir = ${buildout:directory}\src\hooks
pre-make-hook =

[mkdir]
recipe = z3c.recipe.mkdir
paths = dist
    dist/DLLs
    dist/bin
    dist/lib
    dist/libs
    dist/include

[zlib]
<= options
recipe = hexagonit.recipe.cmmi
name = zlib
version = 1.3.2
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-command = cmake
configure-options = -A x64 -B build
                    -DBUILD_SHARED_LIBS=OFF
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[xz]
<= options
recipe = hexagonit.recipe.cmmi
name = xz
version = 5.8.2
url = ${urls:source}/${:name}-${:version}.tar.gz
environment-section = environment-windows
configure-command = cmake
configure-options = -A x64 -B build
                    -DBUILD_SHARED_LIBS=OFF
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[openssl]
<= options
recipe = hexagonit.recipe.cmmi
name = openssl
version = 1.1.1zh
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-options = Configure
                    --prefix=${options:prefix}
                    --libdir=lib
                    --with-zlib-include=${options:prefix}\include
                    --with-zlib-lib=${options:prefix}\lib\zs.lib
                    enable-camellia enable-seed
                    enable-rfc3779 enable-cms
                    enable-md2 enable-rc5
                    enable-ssl3 enable-ssl3-method
                    enable-weak-ssl-ciphers
                    no-shared threads zlib
                    enable-static-engine
                    enable-capieng
                    VC-WIN64A
make-binary = cmd
make-options = /c
make-targets = nmake all && nmake install_sw && nmake test

[libiconv]
<= options
recipe = hexagonit.recipe.cmmi
name = libiconv
version = 1.18
url = ${urls:source}/${:name}-win-build-${:version}-p1.tar.gz
patches =
environment-section = environment-windows
configure-command = msbuild
configure-options = build-VS2017-MT\libiconv.sln
                    /p:Configuration=Release
                    /p:Platform=x64
                    /p:WindowsTargetPlatformVersion=${environment-windows:XSDKVer}
make-binary = make
make-options = -C tests -f check-all-with-cygwin.mak bindir=../build-VS2017-MT/x64/Release/static
make-targets = check
post-make-hook = ${options:hooks-dir}\windows.py:libiconv_post_make

[bzip2]
<= options
recipe = hexagonit.recipe.cmmi
name = bzip2
version = 1.0.8
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}-windows-Makefile.patch
environment-section = environment-windows
configure-command = true
make-binary = nmake
make-options = -f makefile.msc PREFIX=${options:prefix}
make-targets = install

[tcl]
<= options
recipe = hexagonit.recipe.cmmi
name = tcl
version = 8.6.17
url = ${urls:source}/${:name}${:version}-src.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-command = true
make-binary = cmd
make-options = /c
make-targets = "cd win &&
               nmake -f makefile.vc
               INSTALLDIR=${options:prefix}
               release &&
               nmake -f makefile.vc
               INSTALLDIR=${options:prefix}
               install"

[tk]
<= options
recipe = hexagonit.recipe.cmmi
name = tk
version = 8.6.17
url = ${urls:source}/${:name}${:version}-src.tar.gz
environment-section = environment-windows
configure-command = true
make-binary = cmd
make-options = /c
make-targets = "cd win &&
               nmake -f makefile.vc
               INSTALLDIR=${options:prefix}
               TCLDIR=${buildout:directory}\parts\tcl__compile__\tcl${tcl:version}
               release &&
               nmake -f makefile.vc
               INSTALLDIR=${options:prefix}
               TCLDIR=${buildout:directory}\parts\tcl__compile__\tcl${tcl:version}
               install"

[environment-sqlite]
<= environment-windows
TZ = UTC

[sqlite]
<= options
recipe = hexagonit.recipe.cmmi
name = sqlite
version = 3510200
url = ${urls:source}/sqlite-src-${:version}.zip
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-sqlite
configure-command = true
configure-options =
make-binary = cmd
make-options = /c
make-targets = "nmake -f Makefile.msc
               USE_ZLIB=1
               BUILD_ZLIB=0
               ZLIBDIR=${options:prefix}
               ZLIBINCDIR=${options:prefix}\include
               ZLIBLIBDIR=${options:prefix}\lib
               ZLIBLIB=${options:prefix}\lib\zs.lib
               TCLDIR=${options:prefix}
               TCLVERSION=86
               TCLSUFFIX=t
               INSTALLDIR=${options:prefix}
               all dll tclextension-install test &&
               copy /b /v /y sqlite3.h ${options:prefix}\include &&
               copy /b /v /y sqlite3ext.h ${options:prefix}\include &&
               copy /b /v /y sqlite3.dll ${options:prefix}\lib &&
               copy /b /v /y sqlite3.lib ${options:prefix}\lib"

[libxml2]
<= options
recipe = hexagonit.recipe.cmmi
version = 2.15.1
name = libxml2
url = ${urls:source}/${:name}-${:version}.tar.xz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-command = cmake
configure-options = -A x64 -B build
                    -DBUILD_SHARED_LIBS=OFF
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
                    -DLIBXML2_WITH_ZLIB=ON
                    -DLIBXML2_WITH_ICONV=ON
                    -DIconv_INCLUDE_DIR=${options:prefix}\include
                    -DIconv_LIBRARY=${options:prefix}\lib\libiconv-static.lib
                    -DZLIB_INCLUDE_DIR=${options:prefix}\include
                    -DZLIB_LIBRARY=${options:prefix}\lib\zs.lib
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[libxslt]
<= options
recipe = hexagonit.recipe.cmmi
version = 1.1.45
name = libxslt
url = ${urls:source}/${:name}-${:version}.tar.xz
environment-section = environment-windows
configure-command = cmake
configure-options = -A x64 -B build
                    -DBUILD_SHARED_LIBS=OFF
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
                    -DLIBXSLT_WITH_CRYPTO=ON
                    -DLIBXSLT_WITH_PYTHON=OFF
                    -DLIBXSLT_WITH_THREADS=ON
                    -DLIBXML2_INCLUDE_DIRS=${options:prefix}\include\libxml2
                    -DLIBXML2_LIBRARIES=${options:prefix}\lib\libxml2s.lib
                    -DLIBXML2_WITH_ZLIB=ON
                    -DLIBXML2_WITH_ICONV=ON
                    -DIconv_INCLUDE_DIR=${options:prefix}\include
                    -DIconv_LIBRARY=${options:prefix}\lib\libiconv-static.lib
                    -DZLIB_INCLUDE_DIR=${options:prefix}\include
                    -DZLIB_LIBRARY=${options:prefix}\lib\zs.lib
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[libevent]
<= options
recipe = hexagonit.recipe.cmmi
name = libevent
version = 2.1.12
url = ${urls:source}/${:name}-${:version}-stable.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-command = cmake
configure-options = -A x64 -B build
                    -DBUILD_SHARED_LIBS=OFF
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
                    -DOPENSSL_ROOT_DIR=${options:prefix}
                    -DZLIB_INCLUDE_DIR=${options:prefix}\include
                    -DZLIB_LIBRARY=${options:prefix}\lib\zs.lib
                    -DEVENT__DISABLE_REGRESS=ON
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[libffi]
<= options
recipe = hexagonit.recipe.cmmi
name = libffi
version = 3.5.2
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = environment-windows
configure-command = bash
configure-options = configure --prefix=${__environ__:PWD}/dist
                    --disable-docs
                    --disable-shared
                    --build=x86_64-w64-mingw32
                    --host=x86_64-w64-mingw32
                    CONFIG_SHELL="bash"
                    SHELL="bash"
                    CC="../msvcc.sh -m64"
                    CXX="../msvcc.sh -m64"
                    LD="link"
                    LDFLAGS="-no-undefined"
                    NM="dumpbin -symbols"
                    STRIP=":"
                    CPP="cl -nologo -EP"
                    CXXCPP="cl -nologo -EP"
                    CPPFLAGS="-DFFI_STATIC_BUILD -DUSE_STATIC_RTL"
                    CFLAGS="-DFFI_STATIC_BUILD -DUSE_STATIC_RTL"
make-binary = make
make-options = V=1
make-targets = all install

[python]
<= options
recipe = hexagonit.recipe.cmmi
name = python
version = 3.11.15
url = ${urls:source}/Python-${:version}.tgz
patches = ${:patches-dir}\${:name}-${:version}-collections.patch
          ${:patches-dir}\${:name}-${:version}-windows-build.patch
          ${:patches-dir}\${:name}-${:version}-windows-home.patch
          ${:patches-dir}\${:name}-${:version}-windows-test.patch
environment-section = environment-windows
configure-command = install
configure-options = --directory --verbose externals
make-binary = curl
make-options = --insecure --location --progress-bar --output externals\nuget.exe
               https://dist.nuget.org/win-x86-commandline/v5.5.1/nuget.exe
make-targets =
post-make-hook =

[python-win]
<= options
recipe = hexagonit.recipe.cmmi
environment-section = environment-windows
path = ${buildout:directory}\parts\python__compile__\python-${python:version}
configure-command = true
make-binary = cmd
make-options = /c
make-targets = "PCbuild\build.bat -c Release -p x64 --pgo"
post-make-hook = ${options:hooks-dir}\windows.py:python_post_make

[python-test]
<= options
recipe = hexagonit.recipe.cmmi
environment-section = environment-windows
path = ${buildout:directory}\parts\python__compile__\python-${python:version}\PCbuild\amd64
make-binary = cmd
make-options = /c
make-targets = python -m test -u all,-gui -j 1
