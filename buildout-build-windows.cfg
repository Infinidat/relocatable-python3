[buildout]
extends = buildout-build.cfg
parts = mkdir zlib xz libiconv bzip2 openssl tcl tcl-win tk tk-win sqlite3 sqlite3-win libxml2 libxslt libevent python python-win python-test

[environment-windows]
XSystemDrive = C:
XWinDir = ${:XSystemDrive}\WINDOWS
XProgramFiles = ${:XSystemDrive}\Program Files (x86)
FrameworkDir = ${:XWinDir}\Microsoft.NET\Framework64
PerlExe = ${:XSystemDrive}\Perl64\bin\perl.exe
FrameworkVersion = v4.0.30319
WindowsSdkDir = ${:XProgramFiles}\Windows Kits\10
VSINSTALLDIR = ${:XProgramFiles}\Microsoft Visual Studio\2017\Enterprise
VCRoot = ${:VSINSTALLDIR}\VC
VCINSTALLDIR = ${:VCRoot}
NODEBUG = 1
DevEnvDir = ${:VSINSTALLDIR}\Common7\IDE
Msvc = ${:VCRoot}\Tools\MSVC\14.16.27023
XSDKVer = 10.0.17763.0
WindowsSdkInclude = ${:WindowsSdkDir}\Include\${:XSDKVer}
WindowsSdkLib = ${:WindowsSdkDir}\Lib\${:XSDKVer}
VSLIB = ${:Msvc}\lib\x64
VSBIN = ${:Msvc}\bin\Hostx64\x64
SDKBIN = ${:WindowsSdkDir}\bin\${:XSDKVer}\x64
LIB = ${:VSLIB};${:WindowsSdkLib}\um\x64;${:WindowsSdkLib}\ucrt\x64;${:PREFIX}\lib
LIBPATH = ${:FrameworkDir};${:FrameworkDir}\${:FrameworkVersion};${:VSLIB}
INCLUDE = ${:WindowsSdkInclude}\shared;${:WindowsSdkInclude}\um;${:WindowsSdkInclude}\ucrt;${:Msvc}\include;${:PREFIX}\include
Recipe = hexagonit.recipe.cmmi
PosixHomeDir=${:XSystemDrive}\Cygwin\home\Administrator
GitDir = ${:PosixHomeDir}\git
GitBinDir = ${:GitDir}\bin
CygwinBinDir = ${:XSystemDrive}\Cygwin\bin
PATH = ${:VSINSTALLDIR}\MSBuild\15.0\Bin;${:DevEnvDir};${:VSBIN};${:VSINSTALLDIR}\Common7\Tools;${:VSINSTALLDIR}\Common7\Tools\bin;${:FrameworkDir};${:FrameworkDir}\Microsoft .NET Framework 3.5 (Pre-Release Version);${:FrameworkDir}\${:FrameworkVersion};${:VCRoot}\VCPackages;${:SDKBIN};${:XWinDir}\system32;${:XWinDir};${:XWinDir}\System32\Wbem;${:GitDir}\cmd;${:GitBinDir};${:CygwinBinDir};${buildout:directory}\tools\python\bin;${buildout:directory}\tools\python\Scripts;${buildout:directory}\tools\cmake\bin
PREFIX = ${options:prefix}
IIPREFIX = ${options:prefix}
MSVCDIR = ${:VSINSTALLDIR}
VCTargetsPath = ${:VSINSTALLDIR}\Common7\IDE\VC\VCTargets
TZ = 

[options]
configure-command = true
configure-options =
make-binary = nmake
make-options = -f win32/Makefile.msc
make-targets = install
environment-section = environment-windows
prefix = ${buildout:directory}\dist
hooks-dir = ${buildout:directory}\src\hooks
pre-make-hook =

[mkdir]
recipe = z3c.recipe.mkdir
paths = dist
    dist/DLLs
    dist/bin
    dist/lib
    dist/libs
    dist/include

[zlib]
<= options
recipe = hexagonit.recipe.cmmi
name = zlib
version = 1.3.1
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}-windows-Makefile.patch
environment-section = environment-windows

[xz]
<= options
recipe = hexagonit.recipe.cmmi
name = xz
version = 5.8.2
url = ${urls:source}/${:name}-${:version}-windows.zip
configure-command = true
make-binary = true
post-make-hook = ${options:hooks-dir}\windows.py:xz_post_make

[openssl]
name = openssl
version = 1.1.1zd
url = ${urls:source}/${:name}-${:version}.tar.gz
configure-command = ${environment-windows:PerlExe}
configure-options = Configure VC-WIN64A enable-zlib enable-static-engine enable-zlib-dynamic enable-capieng no-asm no-shared --prefix=${options:prefix}
make-targets = install_sw
make-options = 

[libiconv]
<= options
name = libiconv
version = 1.16
url = ${urls:source}/${:name}-${:version}-windows.tar.gz
make-binary = devenv
make-options = build-VS2017/libiconv.sln /build "Release|x64"
make-targets = 
configure-command = true
patches = ${:patches-dir}/${:name}-${:version}-windows-Makefile.patch
post-make-hook = ${options:hooks-dir}\windows.py:libiconv_post_make

[bzip2]
configure-command = true
make-options = -f makefile.msc PREFIX=${options:prefix}
name = bzip2
patches = ${:patches-dir}/${:name}-${:version}-windows-Makefile.patch

[tcl]
<= options
recipe = hexagonit.recipe.cmmi
name = tcl
version = 8.6.12
url = ${urls:source}/${:name}${:version}-src.tar.gz
configure-command = true
make-binary = true

[tcl-win]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}\parts\tcl__compile__\tcl${tcl:version}\win
make-binary = nmake
make-options = -f Makefile.vc all OPTS=static,threads INSTALLDIR=${options:prefix}

[tk]
<= options
recipe = hexagonit.recipe.cmmi
name = tk
version = 8.6.12
url = ${urls:source}/${:name}${:version}-src.tar.gz
configure-command = true
make-binary = true

[tk-win]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}\parts\tk__compile__\tk${tk:version}\win
make-binary = nmake
make-options = -f Makefile.vc all OPTS=static,threads INSTALLDIR=${options:prefix} TCLDIR=${buildout:directory}\parts\tcl__compile__\tcl${tcl:version}

[sqlite3]
<= options
recipe = hexagonit.recipe.cmmi
version = autoconf-3450100
url = ${urls:source}/sqlite-${:version}.tar.gz
configure-command = true
make-binary = true

[sqlite3-win]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}\parts\sqlite3__compile__\sqlite-autoconf-3450100\tea\win
make-binary = nmake
make-options = -f Makefile.vc all OPTS=static,threads INSTALLDIR=${options:prefix}

[libxml2]
<= options
configure-command = cmake
configure-options = -A x64 -B build
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DBUILD_SHARED_LIBS=OFF
                    -DLIBXML2_WITH_ZLIB=ON
                    -DLIBXML2_WITH_ICONV=ON
                    -DIconv_INCLUDE_DIR=${options:prefix}\include
                    -DIconv_LIBRARY=${options:prefix}\lib\libiconv-static.lib
                    -DZLIB_INCLUDE_DIR=${options:prefix}\include
                    -DZLIB_LIBRARY=${options:prefix}\lib\zlib.lib
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[libxslt]
<= options
configure-command = cmake
configure-options = -A x64 -B build
                    -DCMAKE_INSTALL_PREFIX=${options:prefix}
                    -DBUILD_SHARED_LIBS=OFF
                    -DLIBXSLT_WITH_CRYPTO=ON
                    -DLIBXSLT_WITH_PYTHON=OFF
                    -DLIBXSLT_WITH_THREADS=ON
                    -DLIBXML2_INCLUDE_DIRS=${options:prefix}\include\libxml2
                    -DLIBXML2_LIBRARIES=${options:prefix}\lib\libxml2s.lib
                    -DLIBXML2_WITH_ZLIB=ON
                    -DLIBXML2_WITH_ICONV=ON
                    -DIconv_INCLUDE_DIR=${options:prefix}\include
                    -DIconv_LIBRARY=${options:prefix}\lib\libiconv-static.lib
                    -DZLIB_INCLUDE_DIR=${options:prefix}\include
                    -DZLIB_LIBRARY=${options:prefix}\lib\zlib.lib
make-binary = cmd
make-options = /c
make-targets = cmake --build build --config Release &&
               ctest --test-dir build --build-config Release &&
               cmake --install build --config Release

[libevent]
version = 2.0.17
patches =
make-options = -f Makefile.nmake
make-targets = static_libs
post-make-hook = ${options:hooks-dir}\windows.py:libevent_post_make

[libffi]
<= options
name = libffi
# TODO use git-recipe to download directly from https://github.com/python/cpython-source-deps/tree/libffi
url = ${urls:source}/${:name}-cpython.tar.gz
make-binary = true
configure-command = true

[python]
<= options
recipe = hexagonit.recipe.cmmi
environment-section = environment-windows
name = python
version = 3.11.9
patches = ${:patches-dir}\${:name}-${:version}-windows-build.patch
          ${:patches-dir}\${:name}-${:version}-windows-home.patch
          ${:patches-dir}\${:name}-${:version}-collections.patch
configure-command = install
configure-options = --directory --verbose externals
make-binary = curl
make-options = --insecure --location --progress-bar --output externals\nuget.exe
               https://dist.nuget.org/win-x86-commandline/v6.9.1/nuget.exe
make-targets =
post-make-hook =

[python-win]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}\parts\python__compile__\python-${python:version}
configure-command = true
make-binary = cmd
make-options = /c
make-targets = "PCbuild\build.bat -c Release -p x64 --pgo"
post-make-hook = ${options:hooks-dir}\windows.py:python_post_make

[python-test]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}\parts\python__compile__\python-${python:version}\PCbuild\amd64
make-binary = cmd
make-options = /c
make-targets = python -m test -u all,-gui -j 4
