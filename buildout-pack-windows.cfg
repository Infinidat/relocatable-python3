[buildout]
extends = buildout-pack.cfg

[pack]
include_list =
    dist\bin
    dist\DLLs
    dist\include
    dist\Lib
    dist\libs
    dist\tcl
    dist\LICENSE.txt

exclude_list =
    dist\Lib\test
    dist\Lib\ctypes\test
    dist\Lib\distutils\tests
    dist\Lib\idlelib\idle_test
    dist\Lib\lib2to3\tests
    dist\Lib\tkinter\test
    dist\Lib\unittest\test
