[buildout]
develop = .

installed = .installed-build.cfg

parts = runtime libtool libiconv zlib bzip2 lz4 xz zstd libmd libbsd pcre2 ncurses expat readline openssl libev libxml2 libunistring libtasn1 gettext openssh gmp libgpg-error libgcrypt nettle libxslt libevent libuv libsodium libidn2 libffi sqlite cyrus-sasl openldap gdbm c-ares gnutls libunwind libuuid zeromq mpdecimal graphviz-bootstrap graphviz libb2 python

# location of the download cache is specified by the download-cache option
download-cache = .cache

log-level = DEBUG

[options]
ignore-existing = true
keep-compile-dir = true
environment-section = environment
toolkit = /opt/infinidat/toolkit
prefix = ${buildout:directory}/dist
configure-command = ${environment:CONFIG_SHELL} configure
configure-options = --host=${:host}
                    --build=${:host}
                    --target=${:host}
                    --prefix=${:prefix}
                    --libdir=${:prefix}/lib
patches-dir = ${buildout:directory}/src/patches
patch-options = -p1
hooks-dir = ${buildout:directory}/src/hooks
pre-make-hook = ${options:hooks-dir}/posix.py:pre_make_hook
make-options = SHELL=${environment:SHELL}
make-targets = install check

[urls]
gnu = ${urls:source}
source = ftp://python.infinidat.com/python/sources

[environment]
LANG = C
LC_ALL = C
LANGUAGE = C
INPUTRC =
TERM = xterm
SHELL = ${options:toolkit}/bin/bash
CONFIG_SHELL = ${:SHELL}
CC = gcc ${options:cflags}
CXX = g++ ${options:cflags}
CFLAGS = ${options:cflags} -I${options:prefix}/include
CPPFLAGS = ${:CFLAGS}
CXXFLAGS = ${:CFLAGS}
LDXXFLAGS = ${:LDFLAGS}
SHARED_LDFLAGS = ${:LDFLAGS}
PKG_CONFIG_PATH = ${options:prefix}/lib/pkgconfig
PKG_CONFIG = ${options:toolkit}/bin/pkg-config
SSL_CERT_FILE = ${options:toolkit}/etc/ssl/certs/ca-bundle.crt

[runtime]
<= options
recipe = hexagonit.recipe.cmmi
name = runtime
version = 1.0.1
url = ${urls:source}/${:name}-${:version}.tar.gz
configure-command = true
make-options = V=1
               PREFIX="${options:prefix}"
               CC="${environment:CC}"
               CFLAGS="${environment:CFLAGS}"

[libtool]
<= options
recipe = hexagonit.recipe.cmmi
name = libtool
version = 2.4.7
url = ${urls:source}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --enable-ltdl-install
make-targets = install

[zlib]
<= options
recipe = hexagonit.recipe.cmmi
name = zlib
version = 1.3.1
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
configure-options = --prefix=${options:prefix} --shared
environment-section = zlib-environment

[zlib-environment]
<= environment
LDFLAGS = ${options:ldflags}

[bzip2]
<= options
