          ${:patches-dir}/${:name}-${:version}-large-files.patch
          ${:patches-dir}/${:name}-${:version}-no-as-needed.patch
          ${:patches-dir}/${:name}-${:version}-platform.patch
          ${:patches-dir}/${:name}-${:version}-posix-devices.patch
          ${:patches-dir}/${:name}-${:version}-pymacro.patch
          ${:patches-dir}/${:name}-${:version}-readline.patch
          ${:patches-dir}/${:name}-${:version}-run-tests.patch
          ${:patches-dir}/${:name}-${:version}-symlink.patch
          ${:patches-dir}/${:name}-${:version}-sysconfig.patch
          ${:patches-dir}/${:name}-${:version}-tarfile.patch
          ${:patches-dir}/${:name}-${:version}-venv.patch
          ${:patches-dir}/${:name}-${:version}-test-asyncio.patch
          ${:patches-dir}/${:name}-${:version}-test-concurrent.patch
          ${:patches-dir}/${:name}-${:version}-test-dtrace.patch
          ${:patches-dir}/${:name}-${:version}-test-eintr.patch
          ${:patches-dir}/${:name}-${:version}-test-email.patch
          ${:patches-dir}/${:name}-${:version}-test-glob.patch
          ${:patches-dir}/${:name}-${:version}-test-libregrtest.patch
          ${:patches-dir}/${:name}-${:version}-test-locale.patch
          ${:patches-dir}/${:name}-${:version}-test-multiprocessing.patch
          ${:patches-dir}/${:name}-${:version}-test-openpty.patch
          ${:patches-dir}/${:name}-${:version}-test-os.patch
          ${:patches-dir}/${:name}-${:version}-test-posix.patch
          ${:patches-dir}/${:name}-${:version}-test-pty.patch
          ${:patches-dir}/${:name}-${:version}-test-re.patch
          ${:patches-dir}/${:name}-${:version}-test-readline.patch
          ${:patches-dir}/${:name}-${:version}-test-resource.patch
          ${:patches-dir}/${:name}-${:version}-test-shutil.patch
          ${:patches-dir}/${:name}-${:version}-test-smtp.patch
          ${:patches-dir}/${:name}-${:version}-test-socket.patch
          ${:patches-dir}/${:name}-${:version}-test-structures.patch
          ${:patches-dir}/${:name}-${:version}-test-support.patch
          ${:patches-dir}/${:name}-${:version}-test-tarfile.patch
          ${:patches-dir}/${:name}-${:version}-test-termios.patch
          ${:patches-dir}/${:name}-${:version}-test-threaded-import.patch
          ${:patches-dir}/${:name}-${:version}-test-venv.patch
          ${:patches-dir}/${:name}-${:version}-test-zipfile.patch
environment-section = python-environment
make-targets = install test
post-make-hook = ${options:hooks}/unix.py:python_post_make

[python-environment]
<= environment
OPT = -fwrapv -Wall
EXTRATESTOPTS = -j 1 -v

[dist]
<= options
recipe = hexagonit.recipe.cmmi
path = ${buildout:directory}/tests
configure-command = ${options:prefix}/bin/python
configure-options = ${buildout:directory}/tests/test_dist.py
                    --dist ${options:prefix}
                    --python-version ${python:version}
                    --openssl-version ${openssl:version}
                    --zlib-version ${zlib:version}
                    --sqlite-version ${sqlite:runtime}
                    --libffi-version ${libffi:version}
                    --bzip2-version ${bzip2:version}
                    --liblzma-version ${xz:version}
                    --tcl-version ${tcl:version}
                    --expat-version ${expat:version}
                    --openssl-crypto-library libcrypto.so.1.1
                    --openssl-ssl-library libssl.so.1.1
                    --zlib-library libz.so.1
                    --sqlite-library libsqlite3.so
                    --libffi-library libffi.so.8
                    --bzip2-library libbz2.so.1
                    --liblzma-library liblzma.so.5
                    --tcl-library libtcl8.6.so
                    --expat-library libexpat.so.1
pre-make-hook =
make-binary = true
