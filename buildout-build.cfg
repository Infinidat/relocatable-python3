make-targets = install check_local check

[libb2]
<= options
recipe = hexagonit.recipe.cmmi
name = libb2
version = 0.98.1
url = ${urls:source}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-fat
                    --disable-openmp
                    --disable-silent-rules
                    --disable-static
                    --enable-native

[cppunit]
<= options
recipe = hexagonit.recipe.cmmi
name = cppunit
version = 1.15.1
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
pre-configure-hook = ${options:hooks}/unix.py:autogen
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --disable-doxygen
                    --disable-html-docs
                    --enable-latex-docs

[softhsm2]
<= options
recipe = hexagonit.recipe.cmmi
name = SoftHSMv2
version = 2.7.0
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = softhsm2-environment
pre-configure-hook = ${options:hooks}/unix.py:autogen
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-visibility
                    --disable-silent-rules
                    --disable-non-paged-memory
                    --disable-openssl-engines
                    --disable-p11-kit
                    --with-objectstore-backend-db
                    --with-crypto-backend=openssl
                    --with-openssl=${options:prefix}
                    --with-sqlite3=${options:prefix}

[softhsm2-environment]
<= environment
CFLAGS = -pthread ${environment:CFLAGS}
CXXFLAGS = -pthread ${environment:CXXFLAGS}
LDFLAGS = -pthread ${environment:LDFLAGS}

[graphviz-bootstrap]
<= options
recipe = hexagonit.recipe.cmmi
name = graphviz
version = 10.0.1
url = ${urls:source}/${:name}-${:version}.tar.gz
patches = ${:patches-dir}/${:name}-${:version}.patch
environment-section = graphviz-environment
configure-options = ${options:configure-options}
                    --disable-debug
                    --disable-man-pdfs
                    --disable-silent-rules
                    --disable-static
                    --disable-swig
                    --disable-sharp
                    --disable-d
                    --disable-go
                    --disable-guile
                    --disable-java
                    --disable-javascript
                    --disable-lua
                    --disable-ocaml
                    --disable-perl
                    --disable-php
                    --disable-python
                    --disable-python3
                    --disable-r
                    --disable-ruby
                    --disable-tcl
                    --enable-ltdl
                    --without-included-ltdl
                    --without-demos
                    --without-tclsh
                    --without-x
                    --without-ann
                    --without-devil
                    --without-freetype2
                    --without-libgd
                    --without-gdiplus
                    --without-gdk
                    --without-gdk-pixbuf
                    --without-ghostscript
                    --without-glade
                    --without-glut
                    --without-gtk
                    --without-gtkgl
                    --without-gtkglext
                    --without-gts
                    --without-lasi
                    --without-qt
                    --without-quartz
                    --without-pangocairo
                    --without-poppler
                    --without-rsvg
                    --without-smyrna
                    --without-webp
                    --with-expat
                    --with-ltdl-include=${options:prefix}/include
                    --with-ltdl-lib=${options:prefix}/lib
                    --with-zincludedir=${options:prefix}/include
                    --with-zlibdir=${options:prefix}/lib
pre-make-hook =

[graphviz-environment]
<= environment

[graphviz]
<= graphviz-bootstrap
environment-section = graphviz-environment
pre-make-hook = ${options:hooks}/unix.py:pre_make_hook

[graphviz-environment]
<= environment

[python]
<= options
recipe = hexagonit.recipe.cmmi
name = python
version = 3.11.15
url = ${urls:source}/Python-${:version}.tgz
configure-options = ${options:configure-options}
                    --enable-shared
                    --enable-loadable-sqlite-extensions
                    --enable-ipv6
                    --without-static-libpython
                    --with-computed-gotos
                    --with-c-locale-coercion
                    --with-decimal-contextvar
                    --with-freelists
                    --with-pymalloc
                    --with-readline
                    --with-system-expat
                    --with-system-ffi
                    --with-system-libmpdec
                    --with-dbmliborder=gdbm
                    --with-platlibdir=lib
                    --with-ensurepip=no
                    --with-openssl-rpath=no
                    --with-openssl=${options:prefix}
patches = ${:patches-dir}/${:name}-${:version}-bdist.patch
          ${:patches-dir}/${:name}-${:version}-collections.patch
          ${:patches-dir}/${:name}-${:version}-ctypes.patch
          ${:patches-dir}/${:name}-${:version}-disable-modules.patch
          ${:patches-dir}/${:name}-${:version}-distutils.patch
