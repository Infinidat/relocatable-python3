name = lz4
version = 1.9.4
url = ${urls:source}/${:name}-${:version}.tar.gz
configure-command = true
make-options = V=1
               POSIX_ENV=Yes
               BUILD_STATIC=no
               PREFIX="${options:prefix}"
               DIFF="${options:toolkit}/bin/diff"
               INSTALL="${options:toolkit}/bin/install"
               CC="${environment:CC}"
               CPPLAGS="${environment:CPPFLAGS}"
               CFLAGS="${environment:CFLAGS}"
               LDFLAGS="${options:ldflags}"
               SHELL="${environment:SHELL}"

