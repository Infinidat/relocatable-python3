[buildout]
extends = buildout-build.cfg

parts = runtime libtool libiconv zlib bzip2 lz4 xz zstd libmd pcre2 ncurses expat readline openssl libev libxml2 libunistring libtasn1 gettext openssh gmp libgpg-error libgcrypt nettle libxslt libevent libuv libsodium libidn2 libffi sqlite cyrus-sasl openldap gdbm c-ares gnutls zeromq mpdecimal graphviz-bootstrap graphviz libb2 python

[options]
cflags = -pipe -O2 -fPIC -m64
ldflags = -Wl,-64 -Wl,-z,muldefs -L${:prefix}/lib -Wl,-L${:prefix}/lib -lrt

[environment]
LDFLAGS = ${options:ldflags} -Wl,-rpath,\$$ORIGIN -Wl,-rpath,\$$ORIGIN/.. -Wl,-rpath,\$$ORIGIN/../lib
LD_OPTIONS = -64 -z muldefs -L${options:prefix}/lib -rpath $ORIGIN -rpath $ORIGIN/.. -rpath $ORIGIN/../lib
LD_LIBRARY_PATH = ${options:prefix}/lib
AR = ${options:toolkit}/bin/ar
AS = ${options:toolkit}/bin/as
NM = ${options:toolkit}/bin/nm

[openssl]
openssldir = /etc/openssl

[expat-environment]
CPPFLAGS = ${environment:CPPFLAGS} -D_XPG6

[zstd-environment]
LDFLAGS = ${options:ldflags} -Wl,-rpath,'\$$\$$ORIGIN' -Wl,-rpath,'\$$\$$ORIGIN/..' -Wl,-rpath,'\$$\$$ORIGIN/../lib'

[gettext]
make-targets = install

[libxslt]
patches += ${:patches-dir}/${:name}-${:version}-solaris.patch

[libidn2]
make-targets = install

[gnutls]
make-targets = install

[zeromq]
patches = ${:patches-dir}/${:name}-${:version}-solaris.patch

[graphviz-environment]
LDFLAGS = ${environment:LDFLAGS} -Wl,-rpath,\$$ORIGIN/graphviz -Wl,-rpath,\$$ORIGIN/../lib/graphviz

[python]
patches += ${:patches-dir}/${:name}-${:version}-solaris.patch
make-targets = install

[python-environment]
LIBS = -liconv
CFLAGS = ${environment:CFLAGS} -D_XPG6
LDFLAGS = ${environment:LDFLAGS} -Wl,-rpath,\$$ORIGIN/../.. -Wl,-rpath,\$$ORIGIN/../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../../parts/python/lib -Wl,-rpath,\$$ORIGIN/../../../../../parts/python/lib
