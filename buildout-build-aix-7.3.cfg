[buildout]
extends = buildout-build-aix.cfg
parts = gcc-runtime make coreutils libiconv zlib bzip2 lz4 xz zstd pcre2 pkg-config ncurses expat libev readline libxml2 libunistring libtasn1 gettext openssl openssh gmp libgpg-error libgcrypt nettle libxslt libevent libsodium libidn2 libffi libgnugetopt gnutls sqlite gdbm cyrus-sasl openldap mpdecimal zeromq libuv c-ares python

[options]
configure-options = --prefix=${options:prefix}
                    --host=powerpc64-ibm-aix7.3.0.0
                    --build=powerpc64-ibm-aix7.3.0.0
                    --target=powerpc64-ibm-aix7.3.0.0

[environment]
PATH = ${options:prefix}/bin:/home/opt/dev/bin:/opt/freeware/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/ucb:/usr/bin/X11
PKG_CONFIG_PATH = ${options:prefix}/lib/pkgconfig
SHELL = /bin/bash
CONFIG_SHELL = /bin/bash
AR = ar -X64
NM = nm -B -X64
CC = gcc -Os -fPIC -maix64
CXX = g++ -Os -fPIC -maix64
LDFLAGS = -L${options:prefix}/lib -Wl,-blibpath:/usr/lib -Wl,-b64 -Wl,-brtl -Wl,-bmaxdata:0x80000000
LDXXFLAGS = ${:LDFLAGS}
SHARED_LDFLAGS = ${:LDFLAGS}
LIBPATH = ${options:prefix}/lib
CFLAGS = -Os -fPIC -maix64 -I${options:prefix}/include
CPPFLAGS = ${:CFLAGS}
CXXFLAGS = ${:CFLAGS}
DYLD_LIBRARY_PATH =
LD_LIBRARY_PATH =
OBJECT_MODE = 64

[gcc-runtime]
<= options
   gnu
recipe = hexagonit.recipe.cmmi
version = 1.0.0
configure-command = true

[make]
<= options
recipe = hexagonit.recipe.cmmi
name = make
version = 4.4.1
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-nls
                    --without-libiconv-prefix
                    --without-libintl-prefix

[coreutils]
<= options
recipe = hexagonit.recipe.cmmi
name = coreutils
version = 9.4
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-nls
                    --disable-silent-rules
                    --without-libgmp
                    --without-libiconv-prefix
                    --without-libintl-prefix
                    --with-openssl=no
                    --enable-no-install-program=coreutils,hostname,uname
                    FORCE_UNSAFE_CONFIGURE=1

[libiconv]
<= options
recipe = hexagonit.recipe.cmmi
name = libiconv
version = 1.17
url = https://ftp.gnu.org/pub/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-rpath
                    --disable-static
                    --disable-nls
patches = ${:patches-dir}/${:name}-${:version}-lib-Makefile.in.patch

[zlib]
<= options
recipe = hexagonit.recipe.cmmi
name = zlib
version = 1.3
url = https://zlib.net/${:name}-${:version}.tar.gz
configure-options = --prefix=${options:prefix} --shared
patches = ${:patches-dir}/${:name}-${:version}.patch

[bzip2]
<= options
recipe = hexagonit.recipe.cmmi
name = bzip2
version = 1.0.8
url = https://sourceware.org/pub/${:name}/${:name}-${:version}.tar.gz
configure-command = true
make-options = PREFIX=${options:prefix}
               DESTDIR=${options:prefix}
               CC="${environment:CC}"
               CFLAGS="${environment:CFLAGS}"
               LDFLAGS="${environment:LDFLAGS}"
patches = ${:patches-dir}/${:name}-${:version}-Makefile.patch

[lz4]
<= options
recipe = hexagonit.recipe.cmmi
name = lz4
version = 1.9.4
url = https://github.com/${:name}/${:name}/releases/download/v${:version}/${:name}-${:version}.tar.gz
configure-command = true
make-options = V=1 POSIX_ENV=Yes BUILD_STATIC=no
               PREFIX="${options:prefix}"
               CC="${environment:CC}"
               CPPLAGS="${environment:CPPFLAGS}"
               CFLAGS="${environment:CFLAGS}"
               LDFLAGS="${environment:LDFLAGS}"
               SHELL="${environment:SHELL}"
               SONAME_FLAGS=""

[xz]
<= options
recipe = hexagonit.recipe.cmmi
name = xz
version = 5.4.5
url = https://tukaani.org/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-nls
                    --disable-rpath
                    --disable-static
                    --without-libiconv-prefix
                    --without-libintl-prefix

[zstd]
<= options
recipe = hexagonit.recipe.cmmi
name = zstd
version = 1.5.5
url = https://github.com/facebook/${:name}/releases/download/v${:version}/${:name}-${:version}.tar.gz
configure-command = true
make-options = V=1 PREFIX="${options:prefix}"
               SHELL="${environment:SHELL}"
patches = ${:patches-dir}/${:name}-${:version}.patch

[pcre2]
<= options
recipe = hexagonit.recipe.cmmi
name = pcre2
version = 10.42
url = https://github.com/PCRE2Project/pcre2/releases/download/${:name}-${:version}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --disable-pcre2grep-callout-fork
                    --enable-pcre2grep-libbz2
                    --enable-pcre2grep-libz
                    --enable-pcre2-8
                    --enable-pcre2-16
                    --enable-pcre2-32
                    --enable-jit

[pkg-config]
<= options
recipe = hexagonit.recipe.cmmi
name = pkg-config
version = 0.29.2
url = https://pkgconfig.freedesktop.org/releases/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --enable-define-prefix
                    --with-internal-glib
                    --with-libiconv=gnu
                    --with-pc-path=parts/python/lib/pkgconfig

[ncurses]
<= options
recipe = hexagonit.recipe.cmmi
name = ncurses
version = 6.4
url = http://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-home-terminfo
                    --disable-lib-suffixes
                    --disable-rpath
                    --without-cxx
                    --without-cxx-binding
                    --without-ada
                    --without-debug
                    --without-normal
                    --enable-overwrite
                    --enable-widec
                    --enable-ext-colors
                    --enable-pc-files
                    --with-pthread
                    --enable-pthreads-eintr
                    --enable-reentrant
                    --with-shared
                    --program-prefix=
                    --with-shlib-version=rel

[expat]
<= options
recipe = hexagonit.recipe.cmmi
name = expat
version = 2.5.0
url = https://github.com/libexpat/libexpat/releases/download/R_2_5_0/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --without-docbook
                    --without-examples

[libev]
<= options
recipe = hexagonit.recipe.cmmi
name = libev
version = 4.33
url = http://dist.schmorp.de/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options} --disable-static

[readline]
<= options
recipe = hexagonit.recipe.cmmi
name = readline
version = 8.2
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
environment-section = readline-environment
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-install-examples
                    --enable-multibyte
patches = ${:patches-dir}/${:name}-${:version}-001.patch
          ${:patches-dir}/${:name}-${:version}-002.patch
          ${:patches-dir}/${:name}-${:version}-003.patch
          ${:patches-dir}/${:name}-${:version}-004.patch
          ${:patches-dir}/${:name}-${:version}-005.patch
          ${:patches-dir}/${:name}-${:version}-006.patch
          ${:patches-dir}/${:name}-${:version}-007.patch
          ${:patches-dir}/${:name}-${:version}-support-shobj-conf.patch
pre-make-hook = ${buildout:directory}/src/hooks/aix-7.3.py:readline_chmod_install

[readline-environment]
<= environment
LDFLAGS = ${environment:LDFLAGS}
bash_cv_termcap_lib = libncurses

[libxml2]
<= options
recipe = hexagonit.recipe.cmmi
version = 2.12.1
name = libxml2
url = ftp://python.infinidat.com/python/sources/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --without-python
                    --with-threads
                    --with-iconv=${options:prefix}
                    --with-readline=${options:prefix}
                    --with-zlib=${options:prefix}
                    --with-lzma=${options:prefix}

[libunistring]
<= options
recipe = hexagonit.recipe.cmmi
name = libunistring
version = 1.1
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-rpath
                    --with-libiconv-prefix=${options:prefix}

[libtasn1]
<= options
recipe = hexagonit.recipe.cmmi
name = libtasn1
version = 4.19.0
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --disable-gtk-doc-html
                    --disable-doc

[gettext]
<= options
recipe = hexagonit.recipe.cmmi
name = gettext
version = 0.22.3
url = https://ftp.gnu.org/pub/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-rpath
                    --disable-static
                    --disable-libasprintf
                    --disable-java
                    --disable-csharp
                    --disable-openmp
                    --with-included-gettext
                    --with-included-glib
                    --with-included-libcroco
                    --with-libiconv-prefix=${options:prefix}
                    --with-libncurses-prefix=${options:prefix}
                    --with-libunistring-prefix=${options:prefix}
                    --with-libxml2-prefix=${options:prefix}
patches =

[openssl]
<= options
recipe = hexagonit.recipe.cmmi
name = openssl
version = 1.1.1w
url = https://www.openssl.org/source/${:name}-${:version}.tar.gz
configure-command = ./Configure
configure-options = --prefix=${options:prefix}
                    --openssldir=/var/ssl
                    --libdir=lib shared threads zlib aix64-gcc
patches = ${:patches-dir}/${:name}-${:version}.patch
make-targets = install test

[openssh]
<= options
recipe = hexagonit.recipe.cmmi
name = openssh
version = 9.5p1
url = https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --without-rpath
                    --with-zlib=${options:prefix}
                    --with-ssl-dir=${options:prefix}
make-targets = install-nosysconf

[gmp]
<= options
recipe = hexagonit.recipe.cmmi
name = gmp
version = 6.3.0
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-cxx

[libgpg-error]
<= options
recipe = hexagonit.recipe.cmmi
name = libgpg-error
version = 1.47
url = https://gnupg.org/ftp/gcrypt/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-rpath
                    --disable-static
                    --enable-install-gpg-error-config
                    --with-libiconv-prefix=${options:prefix}
                    --with-libintl-prefix=${options:prefix}
                    --with-readline=${options:prefix}

[libgcrypt]
<= options
recipe = hexagonit.recipe.cmmi
name = libgcrypt
version = 1.10.3
url = https://gnupg.org/ftp/gcrypt/${:name}/${:name}-${:version}.tar.bz2
configure-options = ${options:configure-options}
                    --with-gpg-error-prefix=${options:prefix}
                    --disable-asm
                    --disable-static

[nettle]
<= options
recipe = hexagonit.recipe.cmmi
name = nettle
version = 3.9.1
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-documentation
                    --disable-assembler
                    --disable-fat
patches = ${:patches-dir}/${:name}-${:version}-configure.patch
          ${:patches-dir}/${:name}-${:version}-Makefile.in.patch

[libxslt]
<= options
recipe = hexagonit.recipe.cmmi
version = 1.1.39
name = libxslt
url = ftp://python.infinidat.com/python/sources/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-silent-rules
                    --disable-static
                    --without-python
                    --without-debug
                    --without-debugger
                    --without-profiler 
                    --with-crypto
                    --with-plugins
                    --with-libxml-prefix=${options:prefix}

[libevent]
<= options
recipe = hexagonit.recipe.cmmi
name = libevent
version = 2.1.12
url = https://github.com/libevent/libevent/releases/download/release-${:version}-stable/${:name}-${:version}-stable.tar.gz
configure-options = ${options:configure-options}
                    --disable-silent-rules
                    --disable-static

[libsodium]
<= options
recipe = hexagonit.recipe.cmmi
name = libsodium
version = 1.0.19
url = https://download.libsodium.org/${:name}/releases/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --with-pthreads

[libidn2]
<= options
recipe = hexagonit.recipe.cmmi
name = libidn2
version = 2.3.4
url = https://ftp.gnu.org/gnu/libidn/libidn2-2.3.4.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-rpath
                    --disable-silent-rules
                    --disable-gtk-doc
                    --disable-gtk-doc-html
                    --disable-doc
                    --with-libiconv-prefix=${options:prefix}
                    --with-libunistring-prefix=${options:prefix}
                    --with-libintl-prefix=${options:prefix}

[libffi]
<= options
recipe = hexagonit.recipe.cmmi
name = libffi
version = 3.4.4
url = https://github.com/${:name}/${:name}/releases/download/v${:version}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --with-gcc-arch=powerpc64-ibm-aix7.3.0.0
                    --disable-static
                    --disable-docs
patches = ${:patches-dir}/${:name}-${:version}-configure.host.patch

[libgnugetopt]
<= options
recipe = hexagonit.recipe.cmmi
name = libgnugetopt
version = 1.3
url = ftp://python.infinidat.com/python/sources/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options} --disable-static

[gnutls]
<= options
recipe = hexagonit.recipe.cmmi
name = gnutls
version = 3.8.2
url = ftp://python.infinidat.com/python/sources/${:name}-${:version}.tar.gz
environment-section = gnutls-environment
configure-options = ${options:configure-options}
                    --disable-rpath
                    --disable-silent-rules
                    --disable-doc
                    --disable-gtk-doc
                    --disable-gtk-doc-html
                    --disable-guile
                    --disable-static
                    --disable-cxx
                    --disable-libdane
                    --without-brotli
                    --without-p11-kit
                    --without-tpm
                    --without-tpm2
                    --without-libseccomp-prefix
                    --with-libiconv-prefix=${options:prefix}
                    --with-libintl-prefix=${options:prefix}
                    --with-libev-prefix=${options:prefix}
                    --with-libcrypto-prefix=${options:prefix}
                    --with-libz-prefix=${options:prefix}

[gnutls-environment]
<= environment
LIBS = -lgnugetopt

[sqlite]
<= options
recipe = hexagonit.recipe.cmmi
name = sqlite
version = autoconf-3440000
url = https://www.sqlite.org/2023/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --enable-readline

[gdbm]
<= options
recipe = hexagonit.recipe.cmmi
name = gdbm
version = 1.13
url = https://ftp.gnu.org/gnu/${:name}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-rpath
                    --disable-silent-rules
                    --disable-libgdbm-compat
                    --with-libiconv-prefix=${options:prefix}
                    --with-libintl-prefix=${options:prefix}
patches =

[cyrus-sasl]
<= options
recipe = hexagonit.recipe.cmmi
name = cyrus-sasl
version = 2.1.28
url = https://github.com/cyrusimap/${:name}/releases/download/${:name}-${:version}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-macos-framework
                    --without-saslauthd
                    --without-authdaemond
                    --without-gdbm
                    --without-dblib
                    --without-pwcheck
                    --with-openssl=${options:prefix}
pre-make-hook =
patches =
make-targets = install

[openldap]
<= options
recipe = hexagonit.recipe.cmmi
name = openldap
version = 2.6.6
url = https://www.openldap.org/software/download/OpenLDAP/${:name}-release/${:name}-${:version}.tgz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-slapd
                    --disable-backends
                    --with-cyrus-sasl
                    --with-pic
                    --enable-dynamic
                    --with-tls=openssl
patches = ${:patches-dir}/${:name}-${:version}-build-top.mk.patch
          ${:patches-dir}/${:name}-${:version}-configure.patch

[mpdecimal]
<= options
recipe = hexagonit.recipe.cmmi
name = mpdecimal
version = 2.5.1
url = https://www.bytereef.org/software/${:name}/releases/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options} --disable-cxx --enable-shared
patches = ${:patches-dir}/${:name}-${:version}-configure.patch
          ${:patches-dir}/${:name}-${:version}-Makefile.in.patch

[zeromq]
<= options
recipe = hexagonit.recipe.cmmi
version = 4.1.8
name = zeromq
url = https://github.com/zeromq/zeromq4-1/releases/download/v${:version}/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --without-docs
                    --without-documentation
                    --with-libsodium
patches =

[libuv]
<= options
recipe = hexagonit.recipe.cmmi
name = libuv
version = 1.46.0
url = https://dist.libuv.org/dist/v${:version}/${:name}-v${:version}-dist.tar.gz
environment-section = libuv-environment
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules

[libuv-environment]
<= environment
UV_RUN_AS_ROOT = 1

[c-ares]
<= options
recipe = hexagonit.recipe.cmmi
name = c-ares
version = 1.22.1
url = https://c-ares.org/download/${:name}-${:version}.tar.gz
configure-options = ${options:configure-options}
                    --disable-static
                    --disable-silent-rules
                    --enable-nonblocking
                    --enable-tests

[python]
<= options
configure-options = --prefix=${options:prefix}
                    --enable-shared
                    --enable-ipv6
                    --enable-loadable-sqlite-extensions
                    --with-dbmliborder=gdbm
                    --with-system-libmpdec
                    --with-system-expat
                    --with-system-ffi
                    --libdir=${options:prefix}/lib
                    --with-openssl=${options:prefix}
environment-section = python-environment
patches = ${:patches-dir}/${:name}-${:version}-pythonhome-pythonrun.c.patch
          ${:patches-dir}/${:name}-${:version}-linux-symlink.patch
          ${:patches-dir}/${:name}-${:version}-aix-shared.patch
          ${:patches-dir}/${:name}-${:version}-aix-Makefile.patch
          ${:patches-dir}/${:name}-${:version}-aix-Modules-posix-devices.patch
          ${:patches-dir}/${:name}-${:version}-Modules-Setup.patch
          ${:patches-dir}/${:name}-${:version}-setup.py.patch
          ${:patches-dir}/${:name}-${:version}-expat.patch
          ${:patches-dir}/${:name}-${:version}-configure.patch
post-make-hook = ${options:hooks-dir}/aix-7.3.py:python_post_make

[python-environment]
<= environment
ac_cv_lib_readline_append_history = yes
ac_cv_lib_readline_rl_completion_display_matches_hook = yes
ac_cv_lib_readline_rl_completion_matches = yes
ac_cv_lib_readline_rl_pre_input_hook = yes
ac_cv_lib_readline_rl_resize_terminal = yes
CFLAGS = ${environment:CFLAGS}
LDFLAGS = ${environment:LDFLAGS}
OPT = -DNDEBUG -fwrapv -Os -Wall -Wstrict-prototypes
RUNSHARED = LIBPATH=${options:prefix}/lib:.
